name: Build and publish scientific manual

on:
  push:
    branches: [cleanup]
    paths:
      - "docs/**"
      - ".github/workflows/documentation.yml"
      - "lamagoet_qt/options_schema.py"
      - "Tests/scientific_regressions.json"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install manual dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-fonts-recommended texlive-latex-extra
          python -m pip install --upgrade pip
          python -m pip install -r requirements-qt.txt
          python -m pip install -r docs/requirements.txt
      - name: Run lamaGOET regression suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash Tests/run_all.sh
      - name: Build website and PDF
        run: bash docs/build_manual.sh
      - name: Upload PDF build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lamaGOET-Scientific-Manual
          path: output/pdf/lamaGOET-Scientific-Manual.pdf
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
